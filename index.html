<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Task & Deadline Monitoring System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2 rounded-lg">
                    <i data-lucide="graduation-cap" class="w-7 h-7 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Academic Task & Deadline Monitor</h1>
                    <p class="text-xs text-indigo-200">Beleng National High School — Senior High School</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <div class="relative">
                    <button id="bellBtn" class="relative p-2 bg-indigo-700 hover:bg-indigo-800 rounded-lg transition flex items-center gap-2 text-sm font-medium">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                        <span id="alertCountBadge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold hidden">0</span>
                        <span class="hidden md:inline">Alerts</span>
                    </button>
                    <!-- Notification Dropdown -->
                    <div id="alertDropdown" class="hidden absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-2xl border border-slate-100 z-50 text-slate-800 overflow-hidden">
                        <div class="p-3 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                            <span class="font-semibold text-sm">Deadline Reminders</span>
                            <button id="testAlertBtn" class="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-2 py-1 rounded font-medium transition">Test Alert</button>
                        </div>
                        <div id="alertList" class="max-h-64 overflow-y-auto divide-y divide-slate-100 text-sm">
                            <div class="p-4 text-center text-slate-400 text-xs">No urgent deadlines right now.</div>
                        </div>
                    </div>
                </div>

                <button onclick="openModal()" class="bg-white text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-lg font-semibold text-sm shadow transition flex items-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    Record New Task
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- Urgent Banner Alert -->
        <div id="urgentBanner" class="hidden bg-rose-50 border-l-4 border-rose-500 p-4 rounded-r-xl shadow-sm flex items-start justify-between gap-4">
            <div class="flex items-start gap-3">
                <i data-lucide="alert-triangle" class="w-6 h-6 text-rose-500 shrink-0 mt-0.5"></i>
                <div>
                    <h2 class="font-semibold text-rose-900 text-sm">Attention Required!</h2>
                    <p id="urgentBannerText" class="text-xs text-rose-700 mt-0.5"></p>
                </div>
            </div>
            <button onclick="document.getElementById('urgentBanner').classList.add('hidden')" class="text-rose-400 hover:text-rose-600">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- KPI Cards Summary -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Pending Tasks</p>
                    <h3 id="statPending" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
                </div>
                <div class="bg-amber-50 p-3 rounded-lg"><i data-lucide="clock" class="w-6 h-6 text-amber-600"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Upcoming</p>
                    <h3 id="statUpcoming" class="text-2xl font-bold text-indigo-600 mt-1">0</h3>
                </div>
                <div class="bg-indigo-50 p-3 rounded-lg"><i data-lucide="calendar" class="w-6 h-6 text-indigo-600"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Overdue</p>
                    <h3 id="statOverdue" class="text-2xl font-bold text-rose-600 mt-1">0</h3>
                </div>
                <div class="bg-rose-50 p-3 rounded-lg"><i data-lucide="alert-circle" class="w-6 h-6 text-rose-600"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Completed</p>
                    <h3 id="statCompleted" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
                </div>
                <div class="bg-emerald-50 p-3 rounded-lg"><i data-lucide="check-circle-2" class="w-6 h-6 text-emerald-600"></i></div>
            </div>
        </div>

        <!-- Progress Bar Section -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 space-y-2">
            <div class="flex justify-between items-center text-sm">
                <span class="font-semibold text-slate-700">Overall Task Completion Progress</span>
                <span id="progressText" class="font-bold text-indigo-600">0%</span>
            </div>
            <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- Controls: Search & Filter -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
            <div class="w-full sm:w-72 relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                <input type="text" id="searchInput" oninput="renderTasks()" placeholder="Search task or subject..." class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <select id="filterStatus" onchange="renderTasks()" class="px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white focus:outline-none focus:border-indigo-500">
                    <option value="all">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="upcoming">Upcoming</option>
                    <option value="overdue">Overdue</option>
                    <option value="completed">Completed</option>
                </select>
                <button onclick="resetDemoData()" class="text-xs text-slate-500 hover:text-indigo-600 px-3 py-2 border border-slate-200 rounded-lg bg-slate-50 transition">Reset Demo</button>
            </div>
        </div>

        <!-- Task List Grid -->
        <div id="taskGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Dynamic Task Cards go here -->
        </div>

    </main>

    <!-- Modal Form for Adding/Editing Task -->
    <div id="taskModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden animate-in fade-in zoom-in-95 duration-200">
            <div class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-lg">Record New Academic Task</h3>
                <button onclick="closeModal()" class="text-indigo-200 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="taskForm" onsubmit="saveTask(event)" class="p-6 space-y-4">
                <input type="hidden" id="taskId">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Task Title *</label>
                    <input type="text" id="taskTitle" required placeholder="e.g., Research Paper Chapter 3" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Subject / Course *</label>
                    <input type="text" id="taskSubject" required placeholder="e.g., Practical Research, General Mathematics" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Task Type</label>
                        <select id="taskType" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white focus:outline-none focus:border-indigo-500">
                            <option value="Assignment">Assignment</option>
                            <option value="Project">Project</option>
                            <option value="Exam / Quiz">Exam / Quiz</option>
                            <option value="Performance Task">Performance Task</option>
                            <option value="Reading / Lab">Reading / Lab</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Due Date & Time *</label>
                        <input type="datetime-local" id="taskDueDate" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Description / Notes</label>
                    <textarea id="taskDesc" rows="3" placeholder="Add specific instructions or links..." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50 transition">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 transition shadow">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Audio Beep for alerts -->
    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        // Initial Mock Tasks tailored for SHS Students
        const defaultTasks = [
            {
                id: "1",
                title: "Research Paper Chapter 2 Draft",
                subject: "Practical Research 2",
                type: "Project",
                dueDate: new Date(Date.now() + 86400000 * 1).toISOString().slice(0,16),
                description: "Review related literature and synthesize findings.",
                completed: false
            },
            {
                id: "2",
                title: "Calculus Problem Set #4",
                subject: "General Mathematics",
                type: "Assignment",
                dueDate: new Date(Date.now() - 3600000 * 4).toISOString().slice(0,16),
                description: "Solve limits and continuity exercises page 45.",
                completed: false
            },
            {
                id: "3",
                title: "Oral Communication Roleplay Script",
                subject: "Oral Communication",
                type: "Performance Task",
                dueDate: new Date(Date.now() + 86400000 * 4).toISOString().slice(0,16),
                description: "Prepare 3-minute communicative strategy dialogue.",
                completed: false
            }
        ];

        let tasks = JSON.parse(localStorage.getItem('beleng_shs_tasks')) || defaultTasks;

        // Initialize Lucide Icons
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderTasks();
            setupDropdownToggle();
        });

        function setupDropdownToggle() {
            const bellBtn = document.getElementById('bellBtn');
            const dropdown = document.getElementById('alertDropdown');
            bellBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('hidden');
            });
            window.addEventListener('click', () => {
                dropdown.classList.add('hidden');
            });
            document.getElementById('testAlertBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                triggerTestAlert();
            });
        }

        function saveToStorage() {
            localStorage.setItem('beleng_shs_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function resetDemoData() {
            tasks = [...defaultTasks];
            saveToStorage();
        }

        function openModal(editId = null) {
            const modal = document.getElementById('taskModal');
            const form = document.getElementById('taskForm');
            form.reset();
            document.getElementById('taskId').value = '';
            
            if (editId) {
                document.getElementById('modalTitle').innerText = "Edit Academic Task";
                const t = tasks.find(x => x.id === editId);
                if (t) {
                    document.getElementById('taskId').value = t.id;
                    document.getElementById('taskTitle').value = t.title;
                    document.getElementById('taskSubject').value = t.subject;
                    document.getElementById('taskType').value = t.type;
                    document.getElementById('taskDueDate').value = t.dueDate;
                    document.getElementById('taskDesc').value = t.description;
                }
            } else {
                document.getElementById('modalTitle').innerText = "Record New Academic Task";
                // Default datetime to tomorrow
                const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0,16);
                document.getElementById('taskDueDate').value = tomorrow;
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
        }

        function saveTask(e) {
            e.preventDefault();
            const id = document.getElementById('taskId').value;
            const title = document.getElementById('taskTitle').value;
            const subject = document.getElementById('taskSubject').value;
            const type = document.getElementById('taskType').value;
            const dueDate = document.getElementById('taskDueDate').value;
            const description = document.getElementById('taskDesc').value;

            if (id) {
                const idx = tasks.findIndex(x => x.id === id);
                if (idx !== -1) {
                    tasks[idx] = { ...tasks[idx], title, subject, type, dueDate, description };
                }
            } else {
                const newTask = {
                    id: Date.now().toString(),
                    title,
                    subject,
                    type,
                    dueDate,
                    description,
                    completed: false
                };
                tasks.unshift(newTask);
            }

            saveToStorage();
            closeModal();
        }

        function toggleComplete(id) {
            const t = tasks.find(x => x.id === id);
            if (t) {
                t.completed = !t.completed;
                saveToStorage();
            }
        }

        function deleteTask(id) {
            if (confirm("Are you sure you want to delete this task?")) {
                tasks = tasks.filter(x => x.id !== id);
                saveToStorage();
            }
        }

        function getTaskStatus(t) {
            if (t.completed) return 'completed';
            const now = new Date();
            const due = new Date(t.dueDate);
            const diffHours = (due - now) / (1000 * 60 * 60);

            if (diffHours < 0) return 'overdue';
            if (diffHours <= 72) return 'upcoming'; // due within 3 days
            return 'pending';
        }

        function renderTasks() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('filterStatus').value;

            const grid = document.getElementById('taskGrid');
            grid.innerHTML = '';

            let pendingCount = 0;
            let upcomingCount = 0;
            let overdueCount = 0;
            let completedCount = 0;

            let urgentAlerts = [];

            const filtered = tasks.filter(t => {
                const status = getTaskStatus(t);
                
                if (t.completed) completedCount++;
                else if (status === 'overdue') overdueCount++;
                else if (status === 'upcoming') upcomingCount++;
                else pendingCount++;

                const matchesSearch = t.title.toLowerCase().includes(search) || t.subject.toLowerCase().includes(search);
                const matchesFilter = filter === 'all' || status === filter;

                if (!t.completed && (status === 'overdue' || status === 'upcoming')) {
                    urgentAlerts.push(t);
                }

                return matchesSearch && matchesFilter;
            });

            // Update stats
            const total = tasks.length;
            const comp = tasks.filter(x => x.completed).length;
            const percent = total > 0 ? Math.round((comp / total) * 100) : 0;

            document.getElementById('statPending').innerText = pendingCount;
            document.getElementById('statUpcoming').innerText = upcomingCount;
            document.getElementById('statOverdue').innerText = overdueCount;
            document.getElementById('statCompleted').innerText = completedCount;
            document.getElementById('progressText').innerText = percent + '%';
            document.getElementById('progressBar').style.width = percent + '%';

            // Update Alert Badge & Dropdown
            const badge = document.getElementById('alertCountBadge');
            const alertList = document.getElementById('alertList');
            const urgentBanner = document.getElementById('urgentBanner');
            const urgentBannerText = document.getElementById('urgentBannerText');

            if (urgentAlerts.length > 0) {
                badge.innerText = urgentAlerts.length;
                badge.classList.remove('hidden');
                
                urgentBanner.classList.remove('hidden');
                urgentBannerText.innerText = `You have ${urgentAlerts.length} urgent or overdue requirement(s) needing attention!`;

                alertList.innerHTML = urgentAlerts.map(u => `
                    <div class="p-3 hover:bg-slate-50 transition">
                        <p class="font-semibold text-slate-800 line-clamp-1">${u.title}</p>
                        <p class="text-xs text-rose-600 font-medium">Due: ${new Date(u.dueDate).toLocaleString()}</p>
                    </div>
                `).join('');
            } else {
                badge.classList.add('hidden');
                urgentBanner.classList.add('hidden');
                alertList.innerHTML = `<div class="p-4 text-center text-slate-400 text-xs">No urgent deadlines. Great job!</div>`;
            }

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-12 text-center bg-white rounded-xl border border-slate-100">
                        <i data-lucide="clipboard-x" class="w-12 h-12 text-slate-300 mx-auto mb-2"></i>
                        <p class="text-slate-500 font-medium">No tasks found matching your criteria.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = filtered.map(t => {
                const status = getTaskStatus(t);
                let badgeHTML = '';

                if (t.completed) {
                    badgeHTML = `<span class="bg-emerald-50 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-semibold">Completed</span>`;
                } else if (status === 'overdue') {
                    badgeHTML = `<span class="bg-rose-50 text-rose-700 text-xs px-2.5 py-1 rounded-full font-semibold animate-pulse">Overdue</span>`;
                } else if (status === 'upcoming') {
                    badgeHTML = `<span class="bg-amber-50 text-amber-700 text-xs px-2.5 py-1 rounded-full font-semibold">Upcoming</span>`;
                } else {
                    badgeHTML = `<span class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-semibold">Pending</span>`;
                }

                return `
                    <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-100 flex flex-col justify-between space-y-4 hover:shadow-md transition">
                        <div class="space-y-2">
                            <div class="flex justify-between items-start gap-2">
                                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md uppercase tracking-wide">${t.subject}</span>
                                ${badgeHTML}
                            </div>
                            <h3 class="font-bold text-slate-800 text-base leading-snug">${t.title}</h3>
                            <p class="text-xs text-slate-500 font-medium">Type: ${t.type}</p>
                            ${t.description ? `<p class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-lg border border-slate-100">${t.description}</p>` : ''}
                        </div>
                        <div class="pt-3 border-t border-slate-100 flex flex-col gap-2">
                            <div class="flex items-center gap-1.5 text-xs text-slate-500 font-medium">
                                <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i>
                                <span>Due: ${new Date(t.dueDate).toLocaleString()}</span>
                            </div>
                            <div class="flex justify-between items-center pt-2">
                                <button onclick="toggleComplete('${t.id}')" class="text-xs font-semibold px-3 py-1.5 rounded-lg transition ${t.completed ? 'bg-slate-100 text-slate-600 hover:bg-slate-200' : 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100'}">
                                    ${t.completed ? 'Mark Pending' : 'Mark Completed'}
                                </button>
                                <div class="flex items-center gap-1">
                                    <button onclick="openModal('${t.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600 rounded-lg hover:bg-slate-50 transition"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                    <button onclick="deleteTask('${t.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function triggerTestAlert() {
            const sound = document.getElementById('alertSound');
            sound.play().catch(err => console.log("Audio play blocked:", err));
            alert("🔔 TEST ALERT: You have urgent academic tasks due today!");
        }
    </script>
</body>
</html>
